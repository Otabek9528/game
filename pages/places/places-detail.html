<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joy Ma'lumotlari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded without blocking render: a stylesheet in the head holds up first paint
       AND the scripts below it, which delays the API call by however long the font
       server takes. media="print" makes it a non-blocking fetch that is promoted to
       the real stylesheet once it lands; display=swap already covers the FOUT. -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'; this.onload=null" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="places.css" />
  <link rel="stylesheet" href="places-detail.css" />
  <link rel="stylesheet" href="../../css/photo-viewer.css" />

  <script>
    if (localStorage.getItem('theme') === 'night') {
      document.documentElement.classList.add('night-mode');
    }
  </script>
  
</head>
<body>

  <header class="app__header">
    <a href="../../index.html" class="header-content" style="text-decoration: none; color: inherit;">
      <img src="../../assets/emblem.jpg" alt="Bot Emblem" class="bot-logo" />
      <h1>Muslim Vegukin Bot</h1>
    </a>
  </header>

  <div class="detail-container">
    
    <div class="detail-loading" id="detailLoading">
      <div class="detail-spinner"></div>
      <p data-i18n="common.loading">Yuklanmoqda...</p>
    </div>

    <div class="detail-error" id="detailError" style="display: none;">
      <p class="detail-error-icon"><svg class="pl-icon" viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#c2453a" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg></p>
      <p class="detail-error-text" data-i18n="places.error">Xatolik yuz berdi</p>
      <p class="detail-error-hint" id="errorMessage">Ma'lumotlarni yuklashda muammo. Iltimos, qaytadan urinib ko'ring.</p>
      <button class="retry-button" onclick="loadPlaceDetail()" data-i18n="detail.retry">Qaytadan urinish</button>
    </div>

    <div id="detailContent" style="display: none;"></div>

  </div>


  <!-- ==========================================================
       COMMUNITY SUBMISSION SHEET
       One sheet serves all four fields; places-detail.js fills it.
       ========================================================== -->
  <div class="pd-sheet-backdrop" id="pdSheetBackdrop" hidden>
    <div class="pd-sheet" id="pdSheet" role="dialog" aria-modal="true" aria-labelledby="pdSheetTitle">

      <div class="pd-sheet-grip" id="pdSheetGrip"><span class="pd-sheet-grip-bar"></span></div>

      <div class="pd-sheet-head">
        <span class="pd-sheet-icon" id="pdSheetIcon"></span>
        <h3 class="pd-sheet-title" id="pdSheetTitle"></h3>
      </div>

      <div class="pd-sheet-body" id="pdSheetBody">
        <div class="pd-sheet-picker" id="pdSheetPicker" hidden></div>

        <div class="pd-sheet-current" id="pdSheetCurrent" hidden>
          <span class="pd-sheet-current-label" data-i18n="detail.sheet.current">Hozirgi</span>
          <span class="pd-sheet-current-value" id="pdSheetCurrentValue"></span>
        </div>

        <input class="pd-sheet-input" id="pdSheetInput" type="text"
               autocomplete="off" autocapitalize="none" autocorrect="off"
               spellcheck="false" inputmode="url" hidden />

        <textarea class="pd-sheet-textarea" id="pdSheetTextarea"
                  rows="5" maxlength="500" hidden></textarea>

        <div class="pd-sheet-meta" id="pdSheetMeta">
          <span class="pd-sheet-hint" id="pdSheetHint"></span>
          <span class="pd-sheet-counter" id="pdSheetCounter" hidden></span>
        </div>

        <p class="pd-sheet-error" id="pdSheetError" role="alert" hidden></p>

        <p class="pd-sheet-moderation" id="pdSheetModeration" data-i18n="detail.sheet.moderationNote">
          Taklifingiz administrator tekshiruvidan so'ng chop etiladi.
        </p>
      </div>

      <div class="pd-sheet-actions">
        <button type="button" class="pd-sheet-btn pd-sheet-btn--ghost"
                id="pdSheetCancel" data-i18n="detail.sheet.cancel">Bekor qilish</button>
        <button type="button" class="pd-sheet-btn pd-sheet-btn--primary"
                id="pdSheetSend" data-i18n="detail.sheet.send">Yuborish</button>
      </div>

    </div>
  </div>

  <div class="pd-toast" id="pdToast" role="status" aria-live="polite" hidden></div>

  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="../../js/i18n.js"></script>
  <script defer src="../../js/apiConfig.js"></script>
  <script defer src="../../js/photo-viewer.js"></script>
  <script defer src="places-detail.js"></script>

</body>
</html>
