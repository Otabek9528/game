<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Avto Bozor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar"><div class="row">
    <button class="brandsel" id="brandSel">
      <span class="bs-logo" id="hLogo"></span>
      <span class="bs-tw"><span class="bs-name" id="hTitle">Hyundai Sonata</span><span class="bs-sub" id="hSub"></span></span>
      <span class="bs-cv"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <button class="iconbtn" id="themeBtn" aria-label="Tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 109.8 9.8z"/></svg></button>
  </div></header>

  <!-- BROWSE -->
  <section id="pgBrowse" class="page on"><div class="scroll">
    <div id="msum"></div>
    <div class="controls"><div class="sortgrid" id="sortRow"></div><div class="segmented" id="statusRow"></div></div>
    <div class="list" id="browseList"></div>
  </div></section>

  <!-- SEARCH -->
  <section id="pgSearch" class="page"><div class="scroll">
    <button class="pickfield searchfield" id="qModelField"><span class="pf-ic" id="qModelIc" style="background:var(--accent)">🚗</span><span class="pf-tx" id="qModelTxt">Marka va modelni tanlang</span><span class="pf-cv">›</span></button>
    <div class="field"><label>Narx (gacha), ₩</label><input class="input num" id="qPrice" type="text" inputmode="numeric" placeholder="masalan 7 000 000"></div>
    <div class="two">
      <div class="field"><label>Yurgani (km gacha)</label><input class="input num" id="qMile" type="text" inputmode="numeric" placeholder="150 000"></div>
      <div class="field"><label>Yildan</label><input class="input num" id="qYear" type="number" inputmode="numeric" placeholder="2012"></div>
    </div>
    <div class="field"><label>Yoqilg'i</label><div class="chiprow" id="qFuel"></div></div>
    <div class="field"><label>Holati</label><div class="chiprow" id="qStatus"></div></div>
    <div class="sec"><div class="h"><span id="resCount">Natijalar</span></div><div class="list" id="searchList"></div></div>
  </div></section>

  <!-- FAVORITES -->
  <section id="pgFav" class="page"><div class="scroll"><div class="list" id="favList"></div></div></section>

  <!-- SELL (placeholder) -->
  <section id="pgSell" class="page"><div class="scroll">
    <div class="sellph">
      <div class="sellph-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></div>
      <h3>O'z mashinangizni soting</h3>
      <p>Tez orada — bu yerda o'z e'loningizni yarata olasiz: rasm, narx va ma'lumotlarni qo'shib, bevosita bozorga joylaysiz.</p>
      <span class="sellph-soon">Tez orada</span>
    </div>
  </div></section>

  <!-- ALERTS -->
  <section id="pgAlerts" class="page"><div class="scroll">
    <div class="sec" style="margin-top:4px"><div class="h">Yangi xabarnoma</div>
      <div class="field"><label>Model</label><button class="pickfield" id="aModelField"><span class="pf-ic" id="aModelIc" style="background:var(--accent)">🚗</span><span class="pf-tx" id="aModelTxt">Barcha mashinalar</span><span class="pf-cv">›</span></button></div>
      <div class="two">
        <div class="field"><label>Narx gacha, ₩</label><input class="input num" id="aPrice" type="text" inputmode="numeric" placeholder="7 000 000"></div>
        <div class="field"><label>Yurgani gacha</label><input class="input num" id="aMile" type="text" inputmode="numeric" placeholder="150 000"></div>
      </div>
      <div class="field"><label>Yildan</label><input class="input num" id="aYear" type="number" inputmode="numeric" placeholder="2012"></div>
      <div class="field"><label>Yoqilg'i</label><div class="chiprow" id="aFuel"></div></div>
      <button class="bigbtn" id="addAlert"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>Xabarnoma yaratish</button>
    </div>
    <div class="sec"><div class="h">Mening xabarnomalarim</div><div id="alertList"></div></div>
  </div></section>

  <!-- DETAIL overlay -->
  <section id="detail" class="detail">
    <div class="gallery" id="gallery"></div>
    <div class="dbody" id="dbody"></div>
    <div class="abar" id="abar"></div>
  </section>

  <!-- FULLSCREEN MEDIA VIEWER -->
  <div class="viewer" id="viewer">
    <div class="vtop">
      <button class="vclose" id="vClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="vcount" id="vCount"></div>
    </div>
    <div class="vtrack" id="vTrack"></div>
  </div>

  <!-- BRAND PICKER SHEET -->
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="shead">
      <button class="bk" id="sheetBk" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="st" id="sheetTitle">Markani tanlang</div>
      <button class="cl" id="sheetClose">Yopish</button>
    </div>
    <div class="ssearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="sheetSearch" placeholder="Qidirish…" autocomplete="off"></div>
    <div class="scont" id="sheetCont"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="nav" id="nav">
    <button data-tab="browse" class="on"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg><span class="lb">Ko'rish</span></button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span class="lb">Qidirish</span></button>
    <button data-tab="sell"><span class="plusfab"><svg viewBox="0 0 24 24"><path d="M12 7v10M7 12h10"/></svg></span><span class="lb">Sotish</span></button>
    <button data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="lb">Sevimlilar</span></button>
    <button data-tab="alerts"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="lb">Xabarnoma</span></button>
  </nav>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../../js/logger.js"></script>
<script>window.CARS_API_BASE = "https://vegukin-api.duckdns.org/api/cars";</script>
<script src="app.js"></script>
</body>
</html>
