<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bugungi Namoz Vaqtlari</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" />
  <style>
    :root {
      --pb-em:#0f6e56; --pb-emd:#0a5142; --pb-ems:#e4f1ec;
      --pb-amb:#a9791a; --pb-ambs:#f6ecd6; --pb-band:#d9a94e;
      --pb-ink:#1d1d1a; --pb-sub:#6f6e68; --pb-faint:#aeaca4;
      --pb-line:#ece9e1; --pb-surface:#ffffff; --pb-page:#f5f3ee;
    }
    html, body { height:100%; margin:0; padding:0; overflow:visible !important; }
    body { display:flex; flex-direction:column; background:var(--pb-page); }
    .app__header { flex-shrink:0; position:relative; }

    .prayers-detailed {
      flex:1; overflow-y:auto !important; overflow-x:hidden;
      -webkit-overflow-scrolling:touch; padding:0 0 40px;
      background:var(--pb-page); text-align:left;
    }
    .pb-wrap { max-width:480px; margin:0 auto; padding:14px 14px 0; }

    /* ---- location + gear row ---- */
    .pb-loc-row { display:flex; align-items:center; justify-content:space-between; margin:4px 2px 10px; }
    .pb-loc { display:inline-flex; align-items:center; gap:6px; font-size:15px; font-weight:600; color:var(--pb-emd); }
    .pb-loc i { font-size:18px; }
    .pb-gear {
      display:inline-flex; align-items:center; justify-content:center;
      width:38px; height:38px; border-radius:50%; border:1px solid var(--pb-line);
      background:var(--pb-surface); color:var(--pb-sub); cursor:pointer;
      transition:background .15s ease, border-color .15s ease; -webkit-tap-highlight-color:transparent;
    }
    .pb-gear:active { transform:scale(0.96); }
    .pb-gear i { font-size:19px; }

    /* ---- hero countdown ---- */
    .pb-hero {
      background:var(--pb-surface); border:1px solid var(--pb-line);
      border-radius:18px; padding:16px 16px 14px;
    }
    .pb-hero-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .pb-hero-label { font-size:12px; color:var(--pb-sub); }
    .pb-method-pill {
      display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
      color:var(--pb-emd); background:var(--pb-ems); padding:4px 11px; border-radius:999px;
      border:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    .pb-next-line { display:flex; align-items:baseline; gap:7px; margin:6px 0 1px; }
    .pb-next-name { font-size:21px; font-weight:600; color:var(--pb-emd); }
    .pb-next-dot { color:var(--pb-faint); font-size:16px; }
    .pb-next-time { font-size:17px; font-weight:500; color:var(--pb-sub); font-variant-numeric:tabular-nums; }
    .pb-count-row { display:flex; align-items:baseline; gap:8px; }
    .pb-count { font-size:36px; font-weight:600; color:var(--pb-em); font-variant-numeric:tabular-nums; line-height:1.05; }
    .pb-count-label { font-size:13px; color:var(--pb-faint); }
    .pb-prog { height:5px; background:var(--pb-line); border-radius:999px; margin:13px 0 10px; position:relative; }
    .pb-prog-fill { position:absolute; left:0; top:0; height:100%; width:0; background:var(--pb-em); border-radius:999px; transition:width .9s linear; }
    .pb-prog-dot { position:absolute; top:50%; left:0; width:11px; height:11px; border-radius:50%; background:var(--pb-surface); border:2px solid var(--pb-em); transform:translate(-50%,-50%); transition:left .9s linear; }
    .pb-date { font-size:12px; color:var(--pb-faint); }

    /* ---- timeline ---- */
    .pb-timeline { margin-top:16px; background:var(--pb-surface); border:1px solid var(--pb-line); border-radius:18px; padding:8px 14px 8px 8px; }
    .pb-row { display:grid; grid-template-columns:32px 1fr auto; align-items:center; column-gap:12px; min-height:58px; border-radius:14px; padding:6px 6px; }
    .pb-row.is-past { opacity:.5; }
    .pb-row.is-boundary { opacity:.55; min-height:50px; }
    .pb-row.is-faststart { opacity:.9; min-height:52px; }
    .pb-row.is-next { background:var(--pb-ems); }
    .pb-rail { position:relative; align-self:stretch; }
    .pb-line-top, .pb-line-bot { position:absolute; left:15px; width:2px; height:50%; }
    .pb-line-top { top:0; } .pb-line-bot { bottom:0; }
    .pb-node { position:absolute; top:50%; left:10px; transform:translateY(-50%); width:12px; height:12px; border-radius:50%; background:var(--pb-surface); border:2px solid var(--pb-em); }
    .pb-node.n-next { left:8px; width:15px; height:15px; background:var(--pb-em); border-color:var(--pb-em); box-shadow:0 0 0 4px rgba(15,110,86,0.18); }
    .pb-node.n-boundary { left:12px; width:8px; height:8px; background:var(--pb-faint); border:none; }
    .pb-node.n-fast { left:10px; background:var(--pb-band); border:none; }
    .pb-cell { display:flex; align-items:center; gap:10px; min-width:0; }
    .pb-emoji { width:30px; text-align:center; font-size:1.5rem; line-height:1; flex-shrink:0; }
    .pb-row.is-boundary .pb-emoji { font-size:1.15rem; }
    .pb-row.is-faststart .pb-emoji { font-size:1.2rem; }
    .pb-namewrap { display:flex; flex-direction:column; justify-content:center; gap:1px; min-width:0; }
    .pb-name-line { display:flex; align-items:center; gap:7px; min-width:0; }
    .pb-name { font-size:17px; font-weight:600; color:var(--pb-ink); white-space:nowrap; }
    .pb-row.is-next .pb-name { color:var(--pb-emd); }
    .pb-row.is-boundary .pb-name { font-size:14px; font-weight:500; color:var(--pb-sub); }
    .pb-row.is-faststart .pb-name { font-size:15px; }
    .pb-comment { display:block; min-height:15px; font-size:12px; line-height:1.25; color:var(--pb-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pb-time { font-size:21px; font-weight:600; color:var(--pb-ink); font-variant-numeric:tabular-nums; }
    .pb-row.is-next .pb-time { color:var(--pb-emd); }
    .pb-row.is-boundary .pb-time, .pb-row.is-faststart .pb-time { font-size:14px; font-weight:500; color:var(--pb-sub); }
    .pb-chip { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px; margin-left:0; vertical-align:middle; }
    .pb-chip.c-next { color:#fff; background:var(--pb-em); }
    .pb-chip.c-iftar { color:var(--pb-amb); background:var(--pb-ambs); }

    .pb-legend { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--pb-amb); margin:12px 2px 0; }
    .pb-legend .swatch { display:inline-block; width:16px; height:3px; background:var(--pb-band); border-radius:2px; }

    /* ---- nafl ---- */
    .pb-nafl { margin:16px 0; background:var(--pb-surface); border:1px solid var(--pb-line); border-radius:18px; padding:12px 14px; }
    .pb-nafl-head { display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--pb-ink); margin-bottom:6px; }
    .pb-nafl-head i { font-size:17px; color:var(--pb-amb); }
    .nafl-item { border-top:1px solid var(--pb-line); }
    .nafl-row { display:flex; align-items:flex-start; gap:10px; padding:11px 0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .nafl-emoji { font-size:19px; width:22px; flex-shrink:0; margin-top:1px; text-align:center; }
    .nafl-body { flex:1; min-width:0; }
    .nafl-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .nafl-name { font-size:14px; font-weight:600; color:var(--pb-ink); }
    .nafl-status { font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; }
    .nafl-status.s-active { color:#fff; background:var(--pb-em); }
    .nafl-status.s-upcoming { color:var(--pb-emd); background:var(--pb-ems); }
    .nafl-status.s-passed { color:var(--pb-sub); background:var(--pb-line); }
    .nafl-range { font-size:11px; color:var(--pb-faint); font-variant-numeric:tabular-nums; margin-top:2px; }
    .nafl-prog { height:4px; background:var(--pb-line); border-radius:999px; margin-top:6px; position:relative; display:none; }
    .nafl-item.active-window .nafl-prog { display:block; }
    .nafl-fill { position:absolute; left:0; top:0; height:100%; width:0; background:var(--pb-em); border-radius:999px; }
    .nafl-chev { font-size:14px; color:var(--pb-faint); transition:transform .2s ease; flex-shrink:0; margin-top:3px; }
    .nafl-item.open .nafl-chev { transform:rotate(180deg); }
    .nafl-details { max-height:0; overflow:hidden; transition:max-height .25s ease; font-size:12.5px; line-height:1.65; color:var(--pb-sub); }
    .nafl-item.open .nafl-details { max-height:520px; padding:2px 0 12px 32px; }
    .nafl-details .hadith-quote { display:block; margin-top:6px; padding-left:10px; border-left:2px solid var(--pb-band); color:var(--pb-ink); font-style:italic; }
    .nafl-src { display:block; margin-top:8px; font-size:11px; color:var(--pb-faint); }

    /* ---- bottom sheet ---- */
    .sheet-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:200; }
    .sheet-backdrop.visible { opacity:1; pointer-events:auto; }
    .bottom-sheet {
      position:fixed; left:0; right:0; bottom:0; z-index:201; max-width:480px; margin:0 auto;
      background:var(--pb-surface); border-radius:20px 20px 0 0; padding:0 18px 28px;
      transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1);
      max-height:80vh; overflow-y:auto;
    }
    .bottom-sheet.visible { transform:translateY(0); }
    .sheet-handle-wrap { padding:10px 0 4px; display:flex; justify-content:center; cursor:grab; }
    .sheet-handle { width:38px; height:4px; border-radius:999px; background:var(--pb-line); }
    .sheet-header { padding:6px 0 14px; border-bottom:1px solid var(--pb-line); }
    .sheet-title { margin:0; font-size:17px; font-weight:600; color:var(--pb-ink); }
    .sheet-subtitle { margin:4px 0 0; font-size:12.5px; color:var(--pb-sub); }
    .sheet-section { padding:14px 0 4px; }
    .sheet-section-label { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--pb-sub); margin:0 0 8px; }
    .sheet-section-label i { font-size:16px; }
    .option-row {
      display:flex; align-items:center; gap:10px; padding:11px 13px; margin-bottom:8px;
      background:var(--pb-page); border:1px solid var(--pb-line); border-radius:12px; cursor:pointer;
      transition:background .15s ease, border-color .15s ease; -webkit-tap-highlight-color:transparent;
    }
    .option-row:active { transform:scale(0.98); }
    .option-row.selected { background:var(--pb-ems); border-color:var(--pb-em); }
    .option-row-content { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; pointer-events:none; }
    .option-row-name { font-size:14px; font-weight:600; color:var(--pb-ink); }
    .option-row-hint { font-size:11.5px; color:var(--pb-faint); }
    .option-row-radio { width:20px; height:20px; border:2px solid var(--pb-line); border-radius:50%; flex-shrink:0; position:relative; pointer-events:none; }
    .option-row.selected .option-row-radio { border-color:var(--pb-em); }
    .option-row.selected .option-row-radio::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:10px; height:10px; border-radius:50%; background:var(--pb-em); }

    /* ---- night mode ---- */
    .night-mode {
      --pb-em:#34d399; --pb-emd:#6ee7b7; --pb-ems:rgba(6,78,59,0.30);
      --pb-amb:#eab932; --pb-ambs:rgba(181,134,10,0.18); --pb-band:#c79a45;
      --pb-ink:#ececec; --pb-sub:#a7a7a2; --pb-faint:#6f6f6a;
      --pb-line:#2a2a2a; --pb-surface:#1e1e1e; --pb-page:#141414;
    }
  </style>
  <script>
    if (localStorage.getItem('theme') === 'night') {
      document.documentElement.classList.add('night-mode');
    }
  </script>
</head>
<body>

  <header class="app__header">
    <a href="../index.html" class="header-content" style="text-decoration:none; color:inherit;">
      <img src="../assets/emblem.jpg" alt="Bot Emblem" class="bot-logo" />
      <h1>Muslim Vegukin Bot</h1>
    </a>
  </header>

  <section class="prayers-detailed">
    <div class="pb-wrap">

      <div class="pb-loc-row">
        <span class="pb-loc"><i class="ti ti-map-pin" aria-hidden="true"></i><span id="cityName">Yuklanmoqda...</span></span>
        <button id="settingsGearBtn" class="pb-gear" type="button" aria-label="Sozlamalar"><i class="ti ti-settings" aria-hidden="true"></i></button>
      </div>

      <div class="pb-hero">
        <div class="pb-hero-top">
          <span class="pb-hero-label" data-i18n="prayer.nextPrayer">Keyingi namoz</span>
          <button id="methodPillBtn" class="pb-method-pill" type="button">
            <span id="methodSummaryText">MWL</span><span style="opacity:.5">·</span><span id="madhabSummaryText" data-i18n="prayer.schoolHanafi">Hanafiy</span>
          </button>
        </div>
        <div class="pb-next-line">
          <span class="pb-next-name" id="nextPrayerName">Yuklanmoqda...</span>
          <span class="pb-next-dot">·</span>
          <span class="pb-next-time" id="nextPrayerTime">--:--</span>
        </div>
        <div class="pb-count-row">
          <span class="pb-count" id="countdown">--:--:--</span>
          <span class="pb-count-label" data-i18n="prayer.remaining">qoldi</span>
        </div>
        <div class="pb-prog">
          <div class="pb-prog-fill" id="pbProgressFill"></div>
          <div class="pb-prog-dot" id="pbProgressDot"></div>
        </div>
        <div class="pb-date" id="todayDate" data-i18n="prayer.dateLoading">Sana yuklanmoqda...</div>
      </div>

      <div class="pb-timeline" id="prayerTimeline"></div>

      <div class="pb-legend">
        <span class="swatch"></span>
        <span data-i18n="prayer.fastWindow">Ro'za vaqti · Saharlikdan Iftorlikkacha</span>
      </div>

      <div class="pb-nafl">
        <div class="pb-nafl-head">
          <i class="ti ti-stars" aria-hidden="true"></i>
          <span data-i18n="prayer.sunnah.title">Nafl namoz vaqtlari</span>
        </div>
        <div id="naflList"></div>
      </div>

    </div>
  </section>

  <!-- BOTTOM SHEET -->
  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <div id="bottomSheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle-wrap" id="sheetHandleWrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <h3 class="sheet-title" id="sheetTitle" data-i18n="prayer.settings.title">Namoz sozlamalari</h3>
      <p class="sheet-subtitle" data-i18n="prayer.settings.subtitle">Hisoblash usuli va mazhabingizni tanlang</p>
    </div>
    <div class="sheet-section">
      <p class="sheet-section-label"><i class="ti ti-adjustments-alt" aria-hidden="true"></i><span data-i18n="prayer.settings.methodLabel">Hisoblash usuli</span></p>
      <div id="methodOptions"></div>
    </div>
    <div class="sheet-section">
      <p class="sheet-section-label"><i class="ti ti-building-mosque" aria-hidden="true"></i><span data-i18n="prayer.settings.madhabLabel">Mazhab (Asr vaqti uchun)</span></p>
      <div id="madhabOptions"></div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/locationManager.js"></script>
  <script src="../js/prayerTimes.js"></script>
  <script>
  (function () {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { try { tg.ready(); tg.disableVerticalSwipes(); tg.expand(); } catch (e) {} }

    // ---- tunable nafl-window offsets (minutes) ----
    const ISHRAQ_START_OFFSET = 30;   // after sunrise
    const ISHRAQ_WINDOW       = 15;
    const DUHA_START_OFFSET   = 20;   // after sunrise (sun a spear's length)
    const DUHA_END_BEFORE_DHUHR = 60;

    let latest = null; // { timings, currentPrayer, nextPrayer }

    const ROWS = [
      { key: 'Imsak',   type: 'faststart' },
      { key: 'Fajr',    type: 'prayer',   comment: 'prayer.comment.fajr' },
      { key: 'Sunrise', type: 'boundary', comment: 'prayer.comment.sunrise' },
      { key: 'Dhuhr',   type: 'prayer' },
      { key: 'Asr',     type: 'prayer',   comment: 'prayer.comment.asr' },
      { key: 'Maghrib', type: 'prayer',   comment: 'prayer.comment.maghrib', fastEnd: true },
      { key: 'Isha',    type: 'prayer',   comment: 'prayer.comment.isha' }
    ];
    const EMOJI = {
      Imsak: '', Fajr: '\u{1F305}', Sunrise: '\u{1F304}',
      Dhuhr: '\u2600\uFE0F', Asr: '\u{1F324}\uFE0F', Maghrib: '\u{1F307}', Isha: '\u{1F319}'
    };
    const BAND = ['Imsak', 'Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib'];

    const NAFL = [
      { id: 'tahajjud', emoji: '\u{1F319}' },
      { id: 'ishraq',   emoji: '\u{1F304}' },
      { id: 'duha',     emoji: '\u2600\uFE0F' }
    ];

    function tr(key, fb) {
      if (window.I18N) { const v = window.I18N.t(key); return v !== key ? v : fb; }
      return fb;
    }
    function hhmm(s) {
      if (!s) return null;
      const c = String(s).split(' ')[0];
      const parts = c.split(':'); const h = Number(parts[0]); const m = Number(parts[1]);
      if (isNaN(h) || isNaN(m)) return null;
      return h * 60 + m;
    }
    function clean(s) { return (s || '--:--').split(' ')[0]; }
    function fmt(t) {
      const x = ((t % 1440) + 1440) % 1440;
      return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
    }
    function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
    function name(key) { return window.translatePrayer ? window.translatePrayer(key) : key; }
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // ============ TIMELINE ============
    function renderTimeline() {
      const el = document.getElementById('prayerTimeline');
      if (!el) return;
      if (!latest) { el.innerHTML = '<div style="padding:18px;text-align:center;color:var(--pb-faint);font-size:13px;">Yuklanmoqda...</div>'; return; }
      const T = latest.timings, now = nowMin(), next = latest.nextPrayer;
      let html = '';

      ROWS.forEach(function (r) {
        const tmin = hhmm(T[r.key]);
        const timeStr = clean(T[r.key]);
        const inBand = BAND.indexOf(r.key) !== -1;

        let top = 'var(--pb-line)', bot = 'var(--pb-line)';
        if (r.key === 'Imsak') { top = 'transparent'; bot = 'var(--pb-band)'; }
        else if (r.key === 'Maghrib') { top = 'var(--pb-band)'; bot = 'var(--pb-line)'; }
        else if (inBand) { top = 'var(--pb-band)'; bot = 'var(--pb-band)'; }
        if (r.key === 'Isha') { bot = 'transparent'; }

        const isNext = (r.key === next);
        const isPast = (tmin != null && tmin < now && !isNext);

        let rowCls = 'pb-row';
        if (r.type === 'boundary') rowCls += ' is-boundary';
        if (r.type === 'faststart') rowCls += ' is-faststart';
        if (isNext) rowCls += ' is-next';
        else if (isPast) rowCls += ' is-past';

        let node = 'pb-node';
        if (r.type === 'boundary') node += ' n-boundary';
        else if (r.type === 'faststart') node += ' n-fast';
        else if (isNext) node += ' n-next';

        let label, commentText = '';
        if (r.type === 'faststart') {
          label = esc(tr('prayer.suhoor.label', 'Saharlik'));
          commentText = '\u00B7 ' + esc(tr('prayer.suhoor.hint', "Ro'za boshlanishi"));
        } else {
          label = esc(name(r.key));
          if (r.comment) commentText = '(' + esc(tr(r.comment, '')) + ')';
        }

        let chips = '';
        if (isNext) chips += '<span class="pb-chip c-next" data-i18n="prayer.chip.next">keyingi</span>';
        if (r.fastEnd) chips += '<span class="pb-chip c-iftar">' + esc(tr('prayer.iftar.label', 'Iftorlik')) + '</span>';

        html +=
          '<div class="' + rowCls + '">' +
            '<div class="pb-rail">' +
              '<div class="pb-line-top" style="background:' + top + '"></div>' +
              '<div class="pb-line-bot" style="background:' + bot + '"></div>' +
              '<div class="' + node + '"></div>' +
            '</div>' +
            '<div class="pb-cell">' +
              '<span class="pb-emoji">' + (EMOJI[r.key] || '') + '</span>' +
              '<div class="pb-namewrap">' +
                '<span class="pb-name-line"><span class="pb-name">' + label + '</span>' + chips + '</span>' +
                '<span class="pb-comment">' + commentText + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="pb-time">' + esc(timeStr) + '</div>' +
          '</div>';
      });

      el.innerHTML = html;
    }

    function updateHeroProgress() {
      if (!latest) return;
      const fill = document.getElementById('pbProgressFill');
      const dot = document.getElementById('pbProgressDot');
      if (!fill) return;
      const T = latest.timings;
      const curStart = hhmm(T[latest.currentPrayer]);
      const nextStart = hhmm(T[latest.nextPrayer]);
      if (curStart == null || nextStart == null) return;
      const d = new Date();
      const now = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
      let total, elapsed;
      if (nextStart > curStart) { total = nextStart - curStart; elapsed = now >= curStart ? now - curStart : 0; }
      else { total = (1440 - curStart) + nextStart; elapsed = now >= curStart ? now - curStart : (1440 - curStart) + now; }
      const pct = Math.max(0, Math.min(1, elapsed / total)) * 100;
      fill.style.width = pct.toFixed(2) + '%';
      if (dot) dot.style.left = pct.toFixed(2) + '%';
    }

    // ============ NAFL ============
    function computeSunnah(T) {
      const sunrise = hhmm(T.Sunrise), dhuhr = hhmm(T.Dhuhr), fajr = hhmm(T.Fajr), maghrib = hhmm(T.Maghrib);
      const out = { tahajjud: null, ishraq: null, duha: null };
      if (sunrise != null) {
        const s = sunrise + ISHRAQ_START_OFFSET;
        out.ishraq = { start: s, end: s + ISHRAQ_WINDOW };
        out.duha = { start: sunrise + DUHA_START_OFFSET, end: dhuhr != null ? dhuhr - DUHA_END_BEFORE_DHUHR : null };
      }
      // Tahajjud: use Aladhan's own Lastthird field (start) -> Fajr (end), matching the API's night split.
      const lastThird = hhmm(T.Lastthird);
      if (lastThird != null && fajr != null) {
        out.tahajjud = { start: lastThird, end: fajr };
      } else if (fajr != null && maghrib != null) {
        const night = (fajr + 1440) - maghrib;
        const start = ((fajr - Math.round(night / 3)) % 1440 + 1440) % 1440;
        out.tahajjud = { start: start, end: fajr };
      }
      return out;
    }
    function windowStatus(startMin, endMin) {
      if (startMin == null || endMin == null) return { status: 'unknown', progress: 0 };
      const now = nowMin();
      const wraps = endMin < startMin;
      let inside;
      if (!wraps) inside = now >= startMin && now < endMin;
      else inside = now >= startMin || now < endMin;
      if (inside) {
        let total, elapsed;
        if (!wraps) { total = endMin - startMin; elapsed = now - startMin; }
        else { total = (1440 - startMin) + endMin; elapsed = now >= startMin ? now - startMin : (1440 - startMin) + now; }
        return { status: 'active', progress: Math.max(0, Math.min(1, elapsed / total)) };
      }
      let upcoming;
      if (!wraps) upcoming = now < startMin;
      else upcoming = now < startMin && now >= endMin;
      return { status: upcoming ? 'upcoming' : 'passed', progress: 0 };
    }

    function buildNafl() {
      const el = document.getElementById('naflList');
      if (!el) return;
      let html = '';
      NAFL.forEach(function (n) {
        html +=
          '<div class="nafl-item" data-nafl="' + n.id + '">' +
            '<div class="nafl-row">' +
              '<span class="nafl-emoji">' + n.emoji + '</span>' +
              '<div class="nafl-body">' +
                '<div class="nafl-top">' +
                  '<span class="nafl-name">' + esc(tr('prayer.sunnah.' + n.id + '.name', n.id)) + '</span>' +
                  '<span class="nafl-status" id="naflStatus-' + n.id + '">\u2014</span>' +
                '</div>' +
                '<div class="nafl-range" id="naflRange-' + n.id + '">--:-- \u2014 --:--</div>' +
                '<div class="nafl-prog"><div class="nafl-fill" id="naflFill-' + n.id + '"></div></div>' +
              '</div>' +
              '<i class="ti ti-chevron-down nafl-chev" aria-hidden="true"></i>' +
            '</div>' +
            '<div class="nafl-details">' +
              tr('prayer.sunnah.' + n.id + '.desc', '') +
              '<span class="nafl-src">' + esc(tr('prayer.sunnah.' + n.id + '.source', '')) + '</span>' +
            '</div>' +
          '</div>';
      });
      el.innerHTML = html;

      el.querySelectorAll('.nafl-row').forEach(function (row) {
        row.addEventListener('click', function () {
          const item = row.closest('.nafl-item');
          if (item) item.classList.toggle('open');
          if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
        });
      });
      updateNaflLive();
    }

    function updateNaflLive() {
      if (!latest) return;
      const times = computeSunnah(latest.timings);
      NAFL.forEach(function (n) {
        const w = times[n.id];
        const item = document.querySelector('.nafl-item[data-nafl="' + n.id + '"]');
        const rangeEl = document.getElementById('naflRange-' + n.id);
        const statusEl = document.getElementById('naflStatus-' + n.id);
        const fillEl = document.getElementById('naflFill-' + n.id);
        if (!item || !rangeEl || !statusEl) return;

        if (!w || w.start == null || w.end == null) {
          rangeEl.textContent = '--:-- \u2014 --:--';
          statusEl.textContent = '\u2014';
          statusEl.className = 'nafl-status';
          item.classList.remove('active-window');
          return;
        }
        rangeEl.textContent = fmt(w.start) + ' \u2014 ' + fmt(w.end);
        const st = windowStatus(w.start, w.end);
        statusEl.className = 'nafl-status';
        if (st.status === 'active') {
          statusEl.textContent = tr('prayer.status.activeNow', 'Ayni vaqti');
          statusEl.classList.add('s-active');
          item.classList.add('active-window');
          if (fillEl) fillEl.style.width = Math.round(st.progress * 100) + '%';
        } else if (st.status === 'upcoming') {
          statusEl.textContent = tr('prayer.status.upcoming', 'Kutilmoqda');
          statusEl.classList.add('s-upcoming');
          item.classList.remove('active-window');
        } else {
          statusEl.textContent = tr('prayer.status.passed', "Vaqti o'tdi");
          statusEl.classList.add('s-passed');
          item.classList.remove('active-window');
        }
      });
    }

    // ============ STATIC I18N + METHOD PILL ============
    function updateStatic() {
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        if (!window.I18N) return;
        const key = el.getAttribute('data-i18n');
        const v = window.I18N.t(key);
        if (v !== key) { if (/<[a-z]/i.test(v)) el.innerHTML = v; else el.textContent = v; }
      });
      document.title = tr('prayer.pageTitle', 'Bugungi Namoz Vaqtlari');
    }
    function updatePill() {
      const s = window.getPrayerSettings ? window.getPrayerSettings() : { method: '3', madhab: '1' };
      const methods = window.PRAYER_METHODS || {};
      const m = document.getElementById('methodSummaryText');
      const d = document.getElementById('madhabSummaryText');
      if (m) m.textContent = tr('prayer.method.' + s.method + '.name', methods[s.method] || 'MWL');
      if (d) d.textContent = s.madhab === '1' ? tr('prayer.schoolHanafi', 'Hanafiy') : tr('prayer.schoolOthers', "Shofe'iy");
    }

    // ============ BOTTOM SHEET ============
    const HINT_KEY = { '3': 'mwl', '1': 'karachi', '4': 'makkah', '5': 'egypt', '2': 'isna' };

    function buildMethodOptions() {
      const c = document.getElementById('methodOptions');
      if (!c) return;
      c.innerHTML = '';
      const methods = window.PRAYER_METHODS || {};
      Object.keys(methods).forEach(function (key) {
        const row = document.createElement('div');
        row.className = 'option-row';
        row.dataset.methodKey = key;
        row.innerHTML =
          '<div class="option-row-content">' +
            '<span class="option-row-name">' + esc(tr('prayer.method.' + key + '.name', methods[key])) + '</span>' +
            '<span class="option-row-hint">' + esc(tr('prayer.method.' + (HINT_KEY[key] || '') + '.hint', '')) + '</span>' +
          '</div><div class="option-row-radio"></div>';
        row.addEventListener('click', function (e) { e.stopPropagation(); selectMethod(key); });
        c.appendChild(row);
      });
      refreshSelected();
    }
    function buildMadhabOptions() {
      const c = document.getElementById('madhabOptions');
      if (!c) return;
      c.innerHTML = '';
      [
        { key: '1', name: tr('prayer.schoolHanafi', 'Hanafiy'), hint: tr('prayer.hanafiNote', 'Soya = 2x uzunlik') },
        { key: '0', name: tr('prayer.schoolOthers', "Shofe'iy / Molikiy / Hanbaliy"), hint: tr('prayer.shafiiNote', 'Soya = 1x uzunlik') }
      ].forEach(function (o) {
        const row = document.createElement('div');
        row.className = 'option-row';
        row.dataset.madhabKey = o.key;
        row.innerHTML =
          '<div class="option-row-content"><span class="option-row-name">' + esc(o.name) + '</span>' +
          '<span class="option-row-hint">' + esc(o.hint) + '</span></div><div class="option-row-radio"></div>';
        row.addEventListener('click', function (e) { e.stopPropagation(); selectMadhab(o.key); });
        c.appendChild(row);
      });
      refreshSelected();
    }
    function refreshSelected() {
      const s = window.getPrayerSettings ? window.getPrayerSettings() : { method: '3', madhab: '1' };
      document.querySelectorAll('#methodOptions .option-row').forEach(function (r) {
        r.classList.toggle('selected', r.dataset.methodKey === s.method);
      });
      document.querySelectorAll('#madhabOptions .option-row').forEach(function (r) {
        r.classList.toggle('selected', r.dataset.madhabKey === s.madhab);
      });
    }
    function haptic() { if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} } }
    function selectMethod(key) {
      const cur = window.getPrayerSettings();
      if (cur.method === key) { closeSheet(); return; }
      window.savePrayerSettings({ method: key, madhab: cur.madhab });
      refreshSelected(); haptic(); updatePill();
      window.dispatchEvent(new CustomEvent('prayerSettingsChanged'));
      setTimeout(closeSheet, 350);
    }
    function selectMadhab(key) {
      const cur = window.getPrayerSettings();
      if (cur.madhab === key) { closeSheet(); return; }
      window.savePrayerSettings({ method: cur.method, madhab: key });
      refreshSelected(); haptic(); updatePill();
      window.dispatchEvent(new CustomEvent('prayerSettingsChanged'));
      setTimeout(closeSheet, 350);
    }
    function openSheet() {
      const sheet = document.getElementById('bottomSheet');
      const bd = document.getElementById('sheetBackdrop');
      if (!sheet || !bd) return;
      buildMethodOptions(); buildMadhabOptions();
      bd.classList.add('visible');
      requestAnimationFrame(function () { sheet.classList.add('visible'); });
    }
    function closeSheet() {
      const sheet = document.getElementById('bottomSheet');
      const bd = document.getElementById('sheetBackdrop');
      if (sheet) sheet.classList.remove('visible');
      if (bd) bd.classList.remove('visible');
    }
    function wireSheetSwipe() {
      const handle = document.getElementById('sheetHandleWrap');
      const sheet = document.getElementById('bottomSheet');
      if (!handle || !sheet) return;
      let startY = null, curY = 0, dragging = false;
      const start = function (e) { dragging = true; startY = e.touches ? e.touches[0].clientY : e.clientY; curY = startY; sheet.style.transition = 'none'; };
      const move = function (e) { if (!dragging) return; curY = e.touches ? e.touches[0].clientY : e.clientY; sheet.style.transform = 'translateY(' + Math.max(0, curY - startY) + 'px)'; };
      const end = function () { if (!dragging) return; dragging = false; sheet.style.transition = ''; const dd = curY - startY; sheet.style.transform = ''; if (dd > 80) closeSheet(); };
      handle.addEventListener('touchstart', start, { passive: true });
      handle.addEventListener('touchmove', move, { passive: true });
      handle.addEventListener('touchend', end);
      handle.addEventListener('mousedown', start);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
    }

    // ============ EVENTS ============
    window.addEventListener('prayerDataUpdated', function (e) {
      if (e.detail && e.detail.timings) {
        latest = { timings: e.detail.timings, currentPrayer: e.detail.currentPrayer, nextPrayer: e.detail.nextPrayer };
        renderTimeline();
        updateHeroProgress();
        buildNafl();
      }
    });

    window.addEventListener('languageChanged', function () {
      updateStatic(); updatePill();
      renderTimeline(); buildNafl();
    });

    window.addEventListener('prayerSettingsChanged', function () { updatePill(); });

    setInterval(function () { updateHeroProgress(); updateNaflLive(); }, 1000);

    document.addEventListener('DOMContentLoaded', function () {
      updateStatic(); updatePill(); renderTimeline(); wireSheetSwipe();
      const gear = document.getElementById('settingsGearBtn');
      const pill = document.getElementById('methodPillBtn');
      const bd = document.getElementById('sheetBackdrop');
      if (gear) gear.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); openSheet(); });
      if (pill) pill.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); openSheet(); });
      if (bd) bd.addEventListener('click', closeSheet);
      window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
    });
  })();
  </script>
