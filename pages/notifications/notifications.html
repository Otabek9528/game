<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bildirishnomalar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'; this.onload=null" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../places/places.css" />
  <link rel="stylesheet" href="notifications.css" />

  <script>
  if (localStorage.getItem('theme') === 'night') {
    document.documentElement.classList.add('night-mode');
  }
  </script>
</head>
<body>

  <!-- HEADER -->
  <header class="app__header">
    <a href="../../index.html" class="header-content" style="text-decoration: none; color: inherit;">
      <img src="../../assets/emblem.jpg" alt="Bot Emblem" class="bot-logo" />
      <h1>Muslim Vegukin Bot</h1>
    </a>
  </header>

  <div class="places-container nt-page">

    <h2 class="places-page-title nt-title" data-pt="page.title"></h2>
    <p class="nt-via">
      <svg class="nt-via-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2aabee"/><path d="M5.4 11.8 16.9 7.3c.53-.2 1 .13.83.95l-1.96 9.2c-.14.66-.53.82-1.08.51l-3-2.2-1.44 1.39c-.16.16-.3.3-.6.3l.21-3.04 5.53-5c.24-.21-.05-.33-.37-.12l-6.84 4.3-2.94-.92c-.64-.2-.65-.64.14-.95Z" fill="#fff"/></svg>
      <span data-pt="page.via"></span>
    </p>

    <!-- The bot cannot message this person: blocked, or never allowed. -->
    <div class="nt-blocked" id="ntBlocked" role="status" hidden>
      <svg class="pl-icon nt-blocked-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>
      <p class="nt-blocked-text" data-pt="page.blocked"></p>
      <button type="button" class="nt-btn nt-blocked-btn" id="ntAllow" data-pt="page.allow"></button>
    </div>

    <!-- Loading -->
    <div class="nt-state" id="ntLoading">
      <div class="spinner"></div>
      <p data-pt="page.loading"></p>
    </div>

    <!-- Error / outside Telegram -->
    <div class="nt-state" id="ntError" hidden>
      <p class="nt-state-text" id="ntErrorText"></p>
      <button type="button" class="nt-btn nt-btn--ghost" id="ntRetry" data-pt="page.retry"></button>
    </div>

    <!-- FIRST VISIT -->
    <section class="nt-empty" id="ntEmpty" hidden>
      <div class="nt-hero" aria-hidden="true">
        <span class="nt-hero-ring nt-hero-ring--outer"></span>
        <span class="nt-hero-ring nt-hero-ring--inner"></span>
        <span class="nt-hero-bell">
          <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M4 2.5C2.8 3.8 2 5.6 2 7.5M20 2.5c1.2 1.3 2 3.1 2 5"/></svg>
        </span>
        <span class="nt-hero-orb nt-hero-orb--a">🕌</span>
        <span class="nt-hero-orb nt-hero-orb--b">🍽️</span>
        <span class="nt-hero-orb nt-hero-orb--c">🏪</span>
      </div>
      <h3 class="nt-empty-title" data-pt="empty.title"></h3>
      <p class="nt-empty-body" data-pt="empty.body"></p>

      <button type="button" class="nt-choice nt-choice--primary" id="ntEmptyAddArea">
        <span class="nt-choice-icon">
          <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </span>
        <span class="nt-choice-text">
          <span class="nt-choice-title" data-pt="empty.areaTitle"></span>
          <span class="nt-choice-body" data-pt="empty.areaBody"></span>
        </span>
        <svg class="pl-icon nt-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <div class="nt-choice">
        <span class="nt-choice-icon nt-choice-icon--soft">
          <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </span>
        <span class="nt-choice-text">
          <span class="nt-choice-title" data-pt="empty.placeTitle"></span>
          <span class="nt-choice-body" data-pt="empty.placeBody"></span>
          <span class="nt-chips nt-type-links" data-type-links></span>
        </span>
      </div>

      <div class="nt-when">
        <p class="nt-when-title" data-pt="empty.whenTitle"></p>
        <ul class="nt-when-list">
          <li><span aria-hidden="true">🆕</span><span data-pt="empty.whenNew"></span></li>
          <li><span aria-hidden="true">🚫</span><span data-pt="empty.whenClosed"></span></li>
          <li><span aria-hidden="true">📞</span><span data-pt="empty.whenPhone"></span></li>
          <li><span aria-hidden="true">✏️</span><span data-pt="empty.whenName"></span></li>
          <li><span aria-hidden="true">📣</span><span data-pt="empty.whenOwner"></span></li>
          <li><span aria-hidden="true">🕌</span><span data-pt="empty.whenMosque"></span></li>
        </ul>
      </div>
    </section>

    <!-- WITH SUBSCRIPTIONS -->
    <div id="ntLists" hidden>
      <section class="nt-section" aria-labelledby="ntAreasTitle">
        <div class="nt-section-head">
          <h3 class="nt-section-title" id="ntAreasTitle">
            <span class="nt-section-dot" aria-hidden="true"></span>
            <span data-pt="areas.title"></span>
            <span class="nt-section-count" id="ntAreasCount"></span>
          </h3>
          <button type="button" class="nt-add" id="ntAddArea">
            <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-pt="areas.add"></span>
          </button>
        </div>
        <div class="nt-area-list" id="ntAreaList"></div>
      </section>

      <section class="nt-section" aria-labelledby="ntWatchTitle">
        <div class="nt-section-head">
          <h3 class="nt-section-title" id="ntWatchTitle">
            <span class="nt-section-dot" aria-hidden="true"></span>
            <span data-pt="watchlist.title"></span>
            <span class="nt-section-count" id="ntWatchCount"></span>
          </h3>
        </div>
        <div class="nt-place-list" id="ntPlaceList"></div>
      </section>

      <p class="nt-tip">
        <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 1 6 6c0 2.5-1.5 4-2.7 5.2-.8.8-1.3 1.4-1.3 2.3h-4c0-.9-.5-1.5-1.3-2.3C7.5 13 6 11.5 6 9a6 6 0 0 1 6-6Z"/><path d="M10 20h4M11 22.5h2"/></svg>
        <span data-pt="watchlist.hint"></span>
      </p>
    </div>
  </div>

  <!-- Area actions menu -->
  <div class="nt-menu" id="ntMenu" role="menu" hidden>
    <button type="button" class="nt-menu-item" role="menuitem" data-action="edit">
      <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.4 2.4 0 0 1 3.4 3.4L8 18.8 3 20l1.2-5L17 3Z"/></svg>
      <span data-pt="areas.edit"></span>
    </button>
    <button type="button" class="nt-menu-item nt-menu-item--danger" role="menuitem" data-action="delete">
      <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      <span data-pt="areas.delete"></span>
    </button>
  </div>

  <!-- ADD / EDIT AREA SHEET -->
  <div class="pd-sheet-backdrop" id="ntSheetBackdrop" hidden></div>
  <div class="pd-sheet nt-sheet" id="ntSheet" role="dialog" aria-modal="true" aria-labelledby="ntSheetTitle">
    <div class="pd-sheet-grip" id="ntSheetGrip"><span class="pd-sheet-grip-bar"></span></div>
    <div class="pd-sheet-head">
      <span class="pd-sheet-icon">
        <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </span>
      <h3 class="pd-sheet-title" id="ntSheetTitle"></h3>
    </div>

    <div class="pd-sheet-body nt-sheet-body">
      <p class="nt-label" data-pt="areaSheet.center"></p>
      <div class="nt-seg nt-seg--2" role="tablist">
        <button type="button" class="nt-seg-btn" role="tab" data-source="location">
          <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span data-pt="areaSheet.myLocation"></span>
        </button>
        <button type="button" class="nt-seg-btn" role="tab" data-source="address">
          <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          <span data-pt="areaSheet.address"></span>
        </button>
      </div>

      <!-- centre from location -->
      <div class="nt-loc" id="ntLocPanel">
        <svg class="pl-icon nt-loc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <span class="nt-loc-text">
          <span class="nt-loc-main" id="ntLocMain"></span>
          <span class="nt-loc-sub" id="ntLocSub"></span>
        </span>
        <button type="button" class="nt-loc-again" id="ntLocAgain" data-pt="areaSheet.relocate" hidden></button>
      </div>

      <!-- centre from a Korean address -->
      <div class="nt-addr" id="ntAddrPanel" hidden>
        <form class="nt-addr-field" id="ntAddrForm" autocomplete="off">
          <svg class="pl-icon nt-addr-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="nt-addr-input" id="ntAddrInput" maxlength="120" enterkeyhint="search" data-pt-placeholder="areaSheet.addressExample" />
          <!-- "Topish" until the address is found, then "✓ Topildi" (notifications.js). -->
          <button type="submit" class="nt-addr-find" id="ntAddrFind"></button>
        </form>
        <p class="nt-hint" id="ntAddrHint" data-pt="areaSheet.addressHint"></p>
      </div>

      <p class="nt-label" data-pt="areaSheet.radius"></p>
      <div class="nt-seg nt-seg--4" id="ntRadius" role="radiogroup">
        <button type="button" class="nt-seg-btn" role="radio" data-km="1"></button>
        <button type="button" class="nt-seg-btn" role="radio" data-km="3"></button>
        <button type="button" class="nt-seg-btn" role="radio" data-km="5"></button>
        <button type="button" class="nt-seg-btn" role="radio" data-km="10"></button>
      </div>

      <div class="nt-preview" id="ntPreview">
        <div class="nt-map" id="ntMap" aria-hidden="true" hidden></div>
        <svg class="nt-preview-svg" id="ntPreviewSvg" viewBox="0 0 340 168" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
        <p class="nt-preview-empty" id="ntPreviewEmpty"></p>
        <p class="nt-legend" id="ntLegend" hidden></p>
      </div>

      <p class="nt-label" data-pt="areaSheet.which"></p>
      <div class="nt-tiles" id="ntTypes">
        <button type="button" class="nt-tile" data-type="mosque" aria-pressed="true">
          <span class="nt-tile-emoji" aria-hidden="true">🕌</span>
          <span class="nt-tile-name" data-pt="types.mosques"></span>
          <span class="nt-tile-tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
        </button>
        <button type="button" class="nt-tile" data-type="restaurant" aria-pressed="true">
          <span class="nt-tile-emoji" aria-hidden="true">🍽️</span>
          <span class="nt-tile-name" data-pt="types.restaurants"></span>
          <span class="nt-tile-tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
        </button>
        <button type="button" class="nt-tile" data-type="shop" aria-pressed="true">
          <span class="nt-tile-emoji" aria-hidden="true">🏪</span>
          <span class="nt-tile-name" data-pt="types.shops"></span>
          <span class="nt-tile-tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
        </button>
      </div>
      <p class="nt-hint nt-hint--warn" id="ntPickOne" data-pt="areaSheet.pickOne" hidden></p>
      <p class="nt-hint" data-pt="areaSheet.note"></p>
      <p class="pd-sheet-error" id="ntSheetError" role="alert" hidden></p>
    </div>

    <div class="pd-sheet-actions">
      <button type="button" class="pd-sheet-btn pd-sheet-btn--ghost" id="ntSheetCancel" data-pt="common.cancel"></button>
      <button type="button" class="pd-sheet-btn pd-sheet-btn--primary nt-save" id="ntSheetSave">
        <svg class="pl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>
        <span data-pt="common.save"></span>
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div class="pd-toast nt-toast" id="ntToast" role="status" aria-live="polite" hidden>
    <span id="ntToastText"></span>
    <button type="button" class="nt-toast-action" id="ntToastAction" hidden></button>
  </div>

  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Every word on this page lives in places.text.js, which it shares with
       the places pages (the watch pill and the bot use the same words), as it
       shares their styles and photo lookup. The language comes from
       localStorage, so the shared i18n.js (82 KB) is not needed here.
       locationManager.js is loaded by notifications.js when it is needed. -->
  <script defer src="../places/places.text.js"></script>
  <script defer src="../places/places.i18n.js"></script>
  <script defer src="../places/places.photos.js"></script>
  <script defer src="../../js/apiConfig.js"></script>
  <script defer src="notifications.js"></script>

</body>
</html>
