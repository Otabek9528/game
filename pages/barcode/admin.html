<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Admin — Submissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #0a2615; --green-700: #145c34; --green-500: #22a15a;
      --green-400: #34d278; --green-200: #a3ebc5; --green-100: #d1f5e0; --green-50: #f0faf4;
      --red-600: #c0392b; --red-50: #fef2f0; --red-100: #fde3df;
      --amber-600: #b8860b; --amber-50: #fdf8ec; --amber-100: #faecc8;
      --gray-900: #1a1a1a; --gray-700: #444; --gray-500: #777; --gray-400: #999;
      --gray-200: #e2e2e2; --gray-100: #f0f0f0; --gray-50: #f8f8f8;
      --white: #fff; --cream: #f8f5ee;
      --font: 'IBM Plex Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font); background: var(--gray-50);
      color: var(--gray-900); min-height: 100vh;
    }

    /* === HEADER === */
    .header {
      background: var(--green-900); color: var(--white);
      padding: 20px 24px; position: sticky; top: 0; z-index: 100;
    }
    .header__title { font-size: 1.1rem; font-weight: 700; }
    .header__sub { font-size: 0.78rem; color: var(--green-200); margin-top: 2px; }

    /* === TABS === */
    .tabs {
      display: flex; gap: 0; background: var(--white);
      border-bottom: 1px solid var(--gray-200); padding: 0 16px;
      position: sticky; top: 62px; z-index: 99;
    }
    .tab {
      padding: 12px 16px; font-size: 0.82rem; font-weight: 600;
      color: var(--gray-500); border: none; background: none;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--gray-700); }
    .tab--active { color: var(--green-700); border-bottom-color: var(--green-500); }
    .tab__count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 6px;
      border-radius: 10px; font-size: 0.7rem; font-weight: 700;
      margin-left: 6px;
    }
    .tab--active .tab__count--pending { background: var(--amber-100); color: var(--amber-600); }
    .tab__count--pending { background: var(--gray-100); color: var(--gray-500); }
    .tab__count--approved { background: var(--green-50); color: var(--green-700); }
    .tab__count--rejected { background: var(--red-50); color: var(--red-600); }

    /* === CONTENT === */
    .content { max-width: 700px; margin: 0 auto; padding: 16px; }
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--gray-400); font-size: 0.9rem;
    }
    .empty__icon { font-size: 2rem; margin-bottom: 8px; }
    .loading { text-align: center; padding: 40px; color: var(--gray-400); font-size: 0.85rem; }

    /* === SUBMISSION CARD === */
    .sub-card {
      background: var(--white); border-radius: var(--r-lg);
      border: 1px solid var(--gray-200); margin-bottom: 12px;
      overflow: hidden; transition: box-shadow 0.2s;
    }
    .sub-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }

    .sub-card__top {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--gray-100);
    }
    .sub-card__photo {
      width: 56px; height: 56px; border-radius: var(--r-sm);
      object-fit: cover; background: var(--gray-50); flex-shrink: 0;
    }
    .sub-card__photo--empty {
      width: 56px; height: 56px; border-radius: var(--r-sm);
      background: var(--gray-100); display: flex; align-items: center;
      justify-content: center; font-size: 1.3rem; flex-shrink: 0;
    }
    .sub-card__info { flex: 1; min-width: 0; }
    .sub-card__barcode {
      font-family: var(--mono); font-size: 0.88rem; font-weight: 600;
      color: var(--gray-900); letter-spacing: 0.5px;
    }
    .sub-card__meta {
      font-size: 0.73rem; color: var(--gray-400); margin-top: 3px;
    }
    .sub-card__verdict {
      padding: 4px 10px; border-radius: 100px;
      font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
    }
    .sub-card__verdict--halol { background: var(--green-50); color: var(--green-700); }
    .sub-card__verdict--harom { background: var(--red-50); color: var(--red-600); }
    .sub-card__verdict--shubhali { background: var(--amber-50); color: var(--amber-600); }

    /* Flags row */
    .sub-card__flags {
      display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap;
    }
    .flag-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 100px;
      font-size: 0.7rem; font-weight: 600;
    }
    .flag-chip--on { background: var(--red-50); color: var(--red-600); }
    .flag-chip--off { background: var(--green-50); color: var(--green-700); }
    .flag-chip--factory { background: var(--amber-50); color: var(--amber-600); }

    /* Actions row */
    .sub-card__actions {
      display: flex; gap: 8px; padding: 10px 16px;
      border-top: 1px solid var(--gray-100);
    }
    .btn {
      padding: 8px 16px; border-radius: var(--r-sm); border: none;
      font-family: var(--font); font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn--approve { background: var(--green-500); color: var(--white); }
    .btn--approve:hover { background: var(--green-700); }
    .btn--reject { background: var(--gray-100); color: var(--red-600); }
    .btn--reject:hover { background: var(--red-50); }
    .btn--sm { padding: 6px 12px; font-size: 0.75rem; }

    /* Status badges for reviewed items */
    .sub-card__status {
      padding: 10px 16px; border-top: 1px solid var(--gray-100);
      font-size: 0.75rem; color: var(--gray-500);
    }
    .sub-card__status--approved { background: var(--green-50); color: var(--green-700); }
    .sub-card__status--rejected { background: var(--red-50); color: var(--red-600); }

    /* Reject modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-bg--show { display: flex; }
    .modal-box {
      background: var(--white); border-radius: var(--r-lg);
      padding: 24px; width: 90%; max-width: 400px;
    }
    .modal-box__title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .modal-box textarea {
      width: 100%; height: 80px; border: 1px solid var(--gray-200);
      border-radius: var(--r-sm); padding: 10px; font-family: var(--font);
      font-size: 0.85rem; resize: vertical; margin-bottom: 12px;
    }
    .modal-box__btns { display: flex; gap: 8px; justify-content: flex-end; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--green-900); color: var(--white);
      padding: 10px 20px; border-radius: 100px; font-size: 0.82rem;
      font-weight: 600; z-index: 300; display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .toast--show { display: block; animation: toast-in 0.3s ease-out; }
    @keyframes toast-in { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* Fullscreen image viewer */
    .img-viewer {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(0,0,0,0.92); display: none;
      align-items: center; justify-content: center;
      cursor: pointer;
    }
    .img-viewer--show { display: flex; animation: fade-in 0.2s ease-out; }
    .img-viewer__img {
      max-width: 95vw; max-height: 90vh;
      object-fit: contain; border-radius: 8px;
    }
    @keyframes fade-in { from { opacity:0; } to { opacity:1; } }

    /* Edit modal */
    .edit-modal-box {
      background: var(--white); border-radius: var(--r-lg);
      padding: 24px; width: 90%; max-width: 460px;
      max-height: 90vh; overflow-y: auto;
    }
    .edit-modal-box__title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
    .edit-modal-box__barcode {
      font-family: var(--mono); font-size: 0.82rem; color: var(--gray-500);
      margin-bottom: 16px;
    }
    .edit-flags-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    .edit-flag-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--r-sm);
      border: 1.5px solid var(--gray-200); cursor: pointer;
      transition: all 0.15s; user-select: none;
    }
    .edit-flag-row:hover { border-color: var(--gray-400); }
    .edit-flag-row--on { border-color: var(--red-600); background: var(--red-50); }
    .edit-flag-row--factory-on { border-color: var(--amber-600); background: var(--amber-50); }
    .edit-flag-row input[type="checkbox"] { display: none; }
    .edit-flag-row__label { font-size: 0.82rem; font-weight: 600; flex: 1; }
    .edit-flag-row__status { font-size: 0.75rem; font-weight: 700; }
    .edit-flag-row__status--on { color: var(--red-600); }
    .edit-flag-row__status--off { color: var(--green-500); }
    .edit-flag-row--factory-on .edit-flag-row__status--on { color: var(--amber-600); }
    .edit-verdict-preview {
      padding: 10px 14px; border-radius: var(--r-sm);
      font-size: 0.82rem; font-weight: 700; margin-bottom: 16px;
      text-align: center;
    }
    .edit-verdict-preview--halol { background: var(--green-50); color: var(--green-700); }
    .edit-verdict-preview--harom { background: var(--red-50); color: var(--red-600); }
    .edit-verdict-preview--shubhali { background: var(--amber-50); color: var(--amber-600); }
    .btn--edit { background: var(--amber-50); color: var(--amber-600); border: 1.5px solid var(--amber-100); }
    .btn--edit:hover { background: var(--amber-100); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header__title">🔍 Scanner Admin</div>
    <div class="header__sub">Foydalanuvchi yuborgan mahsulotlar</div>
  </div>

  <div class="tabs">
    <button class="tab tab--active" data-status="pending">
      ⏳ Kutilmoqda <span class="tab__count tab__count--pending" id="countPending">0</span>
    </button>
    <button class="tab" data-status="approved">
      ✅ Tasdiqlangan <span class="tab__count tab__count--approved" id="countApproved">0</span>
    </button>
    <button class="tab" data-status="rejected">
      ❌ Rad etilgan <span class="tab__count tab__count--rejected" id="countRejected">0</span>
    </button>
  </div>

  <div class="content" id="content">
    <div class="loading">Yuklanmoqda...</div>
  </div>

  <!-- Reject modal -->
  <div class="modal-bg" id="rejectModal">
    <div class="modal-box">
      <div class="modal-box__title">❌ Rad etish sababi</div>
      <textarea id="rejectNotes" placeholder="Izoh (ixtiyoriy)..."></textarea>
      <div class="modal-box__btns">
        <button class="btn btn--reject btn--sm" id="rejectCancelBtn">Bekor</button>
        <button class="btn btn--approve btn--sm" id="rejectConfirmBtn" style="background:var(--red-600);">Rad etish</button>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal-bg" id="editModal">
    <div class="edit-modal-box">
      <div class="edit-modal-box__title">✏️ Mahsulot ma'lumotlarini tahrirlash</div>
      <div class="edit-modal-box__barcode" id="editBarcode"></div>

      <div class="edit-flags-grid">
        <div class="edit-flag-row" id="efRow-pork" onclick="toggleEditFlag('pork')">
          <span>🐖</span>
          <span class="edit-flag-row__label">Cho'chqa</span>
          <span class="edit-flag-row__status" id="efStatus-pork"></span>
        </div>
        <div class="edit-flag-row" id="efRow-alcohol" onclick="toggleEditFlag('alcohol')">
          <span>🍷</span>
          <span class="edit-flag-row__label">Alkogol</span>
          <span class="edit-flag-row__status" id="efStatus-alcohol"></span>
        </div>
        <div class="edit-flag-row" id="efRow-meat" onclick="toggleEditFlag('meat')">
          <span>🍗</span>
          <span class="edit-flag-row__label">Go'sht</span>
          <span class="edit-flag-row__status" id="efStatus-meat"></span>
        </div>
        <div class="edit-flag-row" id="efRow-seafood" onclick="toggleEditFlag('seafood')">
          <span>🦐</span>
          <span class="edit-flag-row__label">Dengiz m.</span>
          <span class="edit-flag-row__status" id="efStatus-seafood"></span>
        </div>
        <div class="edit-flag-row" id="efRow-factory" onclick="toggleEditFlag('factory')" style="grid-column: span 2;">
          <span>🏭</span>
          <span class="edit-flag-row__label">Bir zavod</span>
          <span class="edit-flag-row__status" id="efStatus-factory"></span>
        </div>
      </div>

      <div class="edit-verdict-preview" id="editVerdictPreview"></div>

      <div class="modal-box__btns">
        <button class="btn btn--reject btn--sm" id="editCancelBtn">Bekor</button>
        <button class="btn btn--approve btn--sm" id="editSaveBtn">💾 Saqlash</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Fullscreen image viewer -->
  <div class="img-viewer" id="imgViewer" onclick="this.classList.remove('img-viewer--show')">
    <img class="img-viewer__img" id="imgViewerSrc" src="" alt="">
  </div>

<script>
const API_BASE = window.location.hostname === 'localhost'
  ? 'http://localhost:5001'
  : 'https://vegukin-api.duckdns.org';

let currentStatus = 'pending';
let rejectingId = null;
let editingId = null;
let editFlags = { pork: false, alcohol: false, meat: false, seafood: false, factory: false };

// === INIT ===
document.addEventListener('DOMContentLoaded', () => {
  loadSubmissions('pending');
  loadCounts();

  // Tab clicks
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab--active'));
      tab.classList.add('tab--active');
      currentStatus = tab.dataset.status;
      loadSubmissions(currentStatus);
    });
  });

  // Reject modal
  document.getElementById('rejectCancelBtn').addEventListener('click', () => {
    document.getElementById('rejectModal').classList.remove('modal-bg--show');
    rejectingId = null;
  });
  document.getElementById('rejectConfirmBtn').addEventListener('click', () => confirmReject());

  document.getElementById('editCancelBtn').addEventListener('click', () => {
    document.getElementById('editModal').classList.remove('modal-bg--show');
    editingId = null;
  });
  document.getElementById('editSaveBtn').addEventListener('click', () => saveEdit());
});

// === LOAD COUNTS ===
async function loadCounts() {
  for (const status of ['pending', 'approved', 'rejected']) {
    try {
      const resp = await fetch(`${API_BASE}/api/scanner/submissions?status=${status}`);
      const data = await resp.json();
      const el = document.getElementById('count' + status.charAt(0).toUpperCase() + status.slice(1));
      el.textContent = data.count || 0;
    } catch (e) {}
  }
}

// === LOAD SUBMISSIONS ===
async function loadSubmissions(status) {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Yuklanmoqda...</div>';

  try {
    const resp = await fetch(`${API_BASE}/api/scanner/submissions?status=${status}`);
    const data = await resp.json();

    if (!data.submissions || data.submissions.length === 0) {
      const msgs = {
        pending: { icon: '📭', text: "Hozircha yangi yuborilmalar yo'q" },
        approved: { icon: '✅', text: "Tasdiqlangan yuborilmalar yo'q" },
        rejected: { icon: '🗑️', text: "Rad etilgan yuborilmalar yo'q" }
      };
      const m = msgs[status];
      content.innerHTML = `<div class="empty"><div class="empty__icon">${m.icon}</div>${m.text}</div>`;
      return;
    }

    content.innerHTML = '';
    data.submissions.forEach(sub => {
      content.appendChild(createCard(sub, status));
    });
  } catch (e) {
    content.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div>Xatolik yuz berdi</div>';
  }
}

// === CREATE CARD ===
function createCard(sub, status) {
  const card = document.createElement('div');
  card.className = 'sub-card';
  card.id = `sub-${sub.id}`;

  // Verdict badge
  const verdictMap = {
    halol: { text: '☪️ Halol', cls: 'halol' },
    harom: { text: '⛔ Harom', cls: 'harom' },
    shubhali: { text: '⚠️ Shubhali', cls: 'shubhali' }
  };
  const v = verdictMap[sub.verdict] || verdictMap.halol;

  // Photo
  let photoHtml;
  if (sub.photo_path) {
    const src = sub.photo_path.startsWith('http') ? sub.photo_path : `${API_BASE}/api/scanner/photo/${sub.photo_path}`;
    photoHtml = `<img class="sub-card__photo" src="${src}" alt="" onclick="openImgViewer('${src}')" style="cursor:pointer;">`;
  } else {
    photoHtml = `<div class="sub-card__photo--empty">📦</div>`;
  }

  // Time
  const time = sub.submitted_at ? new Date(sub.submitted_at).toLocaleString('uz-UZ') : '—';

  // Flags
  const flags = [
    { emoji: '🐖', label: "Cho'chqa", on: sub.pork },
    { emoji: '🍷', label: 'Alkogol', on: sub.alcohol },
    { emoji: '🍗', label: "Go'sht", on: sub.meat },
    { emoji: '🦐', label: 'Dengiz m.', on: sub.seafood },
  ];
  const factoryFlag = sub.same_factory
    ? '<span class="flag-chip flag-chip--factory">🏭 Bir zavod</span>'
    : '';

  const flagsHtml = flags.map(f =>
    `<span class="flag-chip ${f.on ? 'flag-chip--on' : 'flag-chip--off'}">${f.emoji} ${f.on ? '❌' : '✅'} ${f.label}</span>`
  ).join('') + factoryFlag;

  // Actions or status
  let bottomHtml = '';
  if (status === 'pending') {
    bottomHtml = `
      <div class="sub-card__actions">
        <button class="btn btn--approve" onclick="approveSubmission(${sub.id})">✅ Tasdiqlash</button>
        <button class="btn btn--edit" onclick="openEditModal(${sub.id}, ${sub.pork}, ${sub.alcohol}, ${sub.meat}, ${sub.seafood}, ${sub.same_factory})">✏️ Tahrirlash</button>
        <button class="btn btn--reject" onclick="openRejectModal(${sub.id})">❌ Rad etish</button>
      </div>`;
  } else if (status === 'approved') {
    const reviewTime = sub.reviewed_at ? new Date(sub.reviewed_at).toLocaleString('uz-UZ') : '';
    bottomHtml = `<div class="sub-card__status sub-card__status--approved">✅ Tasdiqlangan ${reviewTime}</div>`;
  } else {
    const reviewTime = sub.reviewed_at ? new Date(sub.reviewed_at).toLocaleString('uz-UZ') : '';
    const notes = sub.admin_notes ? ` — "${sub.admin_notes}"` : '';
    bottomHtml = `<div class="sub-card__status sub-card__status--rejected">❌ Rad etilgan ${reviewTime}${notes}</div>`;
  }

  card.innerHTML = `
    <div class="sub-card__top">
      ${photoHtml}
      <div class="sub-card__info">
        <div class="sub-card__barcode">${sub.barcode}</div>
        <div class="sub-card__meta">👤 ${sub.user_id || 'Noma\'lum'} · ${time}</div>
      </div>
      <span class="sub-card__verdict sub-card__verdict--${v.cls}">${v.text}</span>
    </div>
    <div class="sub-card__flags">${flagsHtml}</div>
    ${bottomHtml}
  `;

  return card;
}

// === APPROVE ===
async function approveSubmission(id) {
  try {
    const resp = await fetch(`${API_BASE}/api/scanner/submissions/${id}/approve`, { method: 'POST' });
    const data = await resp.json();
    if (data.success) {
      document.getElementById(`sub-${id}`)?.remove();
      showToast('✅ Tasdiqlandi va bazaga qo\'shildi');
      loadCounts();
      // If no cards left, show empty
      if (document.getElementById('content').children.length === 0) {
        loadSubmissions(currentStatus);
      }
    } else {
      showToast('⚠️ Xatolik: ' + (data.error || ''));
    }
  } catch (e) {
    showToast('⚠️ Serverga ulanib bo\'lmadi');
  }
}

// === REJECT ===
function openRejectModal(id) {
  rejectingId = id;
  document.getElementById('rejectNotes').value = '';
  document.getElementById('rejectModal').classList.add('modal-bg--show');
}

async function confirmReject() {
  if (!rejectingId) return;
  const notes = document.getElementById('rejectNotes').value.trim();

  try {
    const resp = await fetch(`${API_BASE}/api/scanner/submissions/${rejectingId}/reject`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes })
    });
    const data = await resp.json();
    if (data.success) {
      document.getElementById(`sub-${rejectingId}`)?.remove();
      showToast('❌ Rad etildi');
      loadCounts();
      if (document.getElementById('content').children.length === 0) {
        loadSubmissions(currentStatus);
      }
    }
  } catch (e) {
    showToast('⚠️ Serverga ulanib bo\'lmadi');
  }

  document.getElementById('rejectModal').classList.remove('modal-bg--show');
  rejectingId = null;
}

// === EDIT ===
function openEditModal(id, pork, alcohol, meat, seafood, factory) {
  editingId = id;
  editFlags = {
    pork: !!pork, alcohol: !!alcohol,
    meat: !!meat, seafood: !!seafood, factory: !!factory
  };

  // Find barcode from card
  const card = document.getElementById(`sub-${id}`);
  const barcode = card?.querySelector('.sub-card__barcode')?.textContent || '';
  document.getElementById('editBarcode').textContent = '📦 ' + barcode;

  _refreshEditUI();
  document.getElementById('editModal').classList.add('modal-bg--show');
}

function toggleEditFlag(name) {
  editFlags[name] = !editFlags[name];
  _refreshEditUI();
}

function _refreshEditUI() {
  const flagDefs = [
    { key: 'pork',    label: 'Cho\'chqa', factory: false },
    { key: 'alcohol', label: 'Alkogol',   factory: false },
    { key: 'meat',    label: 'Go\'sht',   factory: false },
    { key: 'seafood', label: 'Dengiz m.', factory: false },
    { key: 'factory', label: 'Bir zavod', factory: true  },
  ];

  flagDefs.forEach(({ key, factory }) => {
    const row = document.getElementById(`efRow-${key}`);
    const status = document.getElementById(`efStatus-${key}`);
    const on = editFlags[key];

    row.classList.remove('edit-flag-row--on', 'edit-flag-row--factory-on');
    if (on) row.classList.add(factory ? 'edit-flag-row--factory-on' : 'edit-flag-row--on');

    status.className = `edit-flag-row__status ${on ? 'edit-flag-row__status--on' : 'edit-flag-row__status--off'}`;
    status.textContent = on ? '❌ Mavjud' : '✅ Yo\'q';
  });

  // Verdict preview
  const { pork, alcohol, meat, seafood, factory } = editFlags;
  let verdict, verdictText;
  if (pork || alcohol || meat || seafood) {
    verdict = 'harom'; verdictText = '⛔ Harom';
  } else if (factory) {
    verdict = 'shubhali'; verdictText = '⚠️ Shubhali';
  } else {
    verdict = 'halol'; verdictText = '☪️ Halol';
  }
  const preview = document.getElementById('editVerdictPreview');
  preview.className = `edit-verdict-preview edit-verdict-preview--${verdict}`;
  preview.textContent = verdictText;
}

async function saveEdit() {
  if (!editingId) return;
  try {
    const resp = await fetch(`${API_BASE}/api/scanner/submissions/${editingId}/edit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pork: editFlags.pork ? 1 : 0,
        alcohol: editFlags.alcohol ? 1 : 0,
        meat: editFlags.meat ? 1 : 0,
        seafood: editFlags.seafood ? 1 : 0,
        same_factory: editFlags.factory ? 1 : 0
      })
    });
    const data = await resp.json();
    if (data.success) {
      document.getElementById('editModal').classList.remove('modal-bg--show');
      showToast('💾 Saqlandi');
      loadSubmissions(currentStatus); // Reload to reflect updated flags
    } else {
      showToast('⚠️ Xatolik: ' + (data.error || ''));
    }
  } catch (e) {
    showToast('⚠️ Serverga ulanib bo\'lmadi');
  }
  editingId = null;
}

// === FULLSCREEN IMAGE ===
function openImgViewer(src) {
  event.stopPropagation();
  document.getElementById('imgViewerSrc').src = src;
  document.getElementById('imgViewer').classList.add('img-viewer--show');
}

// === TOAST ===
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast toast--show';
  setTimeout(() => toast.className = 'toast', 2500);
}
</script>
