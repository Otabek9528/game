<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Biznes Katalogi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'; this.onload=null" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="business.css" />

  <script>
  if (localStorage.getItem('theme') === 'night') {
    document.documentElement.classList.add('night-mode');
  }
  </script>
</head>
<body>

  <header class="app__header">
    <a href="../../index.html" class="header-content" style="text-decoration: none; color: inherit;">
      <img src="../../assets/emblem.jpg" alt="Bot Emblem" class="bot-logo" />
      <h1>Muslim Vegukin Bot</h1>
    </a>
  </header>

  <div class="bz-scroll" id="bzScroll">

    <!-- Title + search + chips stay put while the feed moves under them. -->
    <div class="bz-sticky" id="bzSticky">
      <div class="bz-titlebar">
        <h2 class="bz-title" id="bzTitle">Biznes Katalogi</h2>
        <span class="bz-count" id="bzCount"></span>
      </div>

      <div class="bz-searchwrap">
        <span class="bz-search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input type="search" class="bz-search" id="bzSearch"
               placeholder="Biznes qidirish" autocomplete="off"
               autocapitalize="none" spellcheck="false" />
        <button class="bz-search-clear" id="bzSearchClear" type="button" aria-label="Tozalash" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- One control, showing current state. A horizontal rail would hide
           its own tail offscreen and imply a precedence among categories
           that does not exist. -->
      <div class="bz-filterbar">
        <button class="bz-filter" id="bzFilter" type="button" aria-haspopup="dialog">
          <span class="bz-glyph bz-glyph--filter" id="bzFilterGlyph" aria-hidden="true">&#9670;</span>
          <span class="bz-filter-text">
            <span class="bz-filter-kicker">Yo'nalish</span>
            <span class="bz-filter-label" id="bzFilterLabel">Barcha yo'nalishlar</span>
          </span>
          <span class="bz-filter-caret" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </button>
        <button class="bz-filter-clear" id="bzFilterClear" type="button" aria-label="Filtrni olib tashlash" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="bz-body" id="bzBody"></div>

    <!-- Loading is drawn as a skeleton inside .bz-body; this stays only as
         the fallback the sheets reuse. The former #bzEmpty block was never
         reachable — empties are composed into the body by emptyBlock(). -->
    <div class="bz-state" id="bzLoading" hidden>
      <div class="bz-spinner"></div>
    </div>

    <div class="bz-state" id="bzError" hidden>
      <span class="bz-glyph bz-blank-glyph" aria-hidden="true">&#9888;</span>
      <p class="bz-state-title">Yuklab bo&#8216;lmadi</p>
      <p class="bz-state-hint">Internet aloqasini tekshiring va qayta urinib ko&#8216;ring.</p>
      <button class="bz-btn" id="bzRetry" type="button">Qayta urinish</button>
    </div>

  </div>

  <!-- DETAIL SHEET -->
  <div class="bz-sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="bz-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
      <div class="bz-sheet-grip"><span class="bz-sheet-grip-bar"></span></div>
      <div class="bz-sheet-scroll" id="sheetScroll"></div>
    </div>
  </div>

  <div class="bz-toast" id="bzToast" role="status" aria-live="polite" hidden></div>

  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="../../js/logger.js"></script>
  <script defer src="../../js/apiConfig.js"></script>
  <script defer src="business.js"></script>

</body>
</html>
