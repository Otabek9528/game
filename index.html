<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halal Compass</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
  if (localStorage.getItem('theme') === 'night') {
    document.documentElement.classList.add('night-mode');
  }
  </script>
</head>
<body>
  <!-- HEADER (Panel 1) -->
  <header class="app__header">
    <div class="header-content">
      <img src="assets/emblem.jpg" alt="Bot Emblem" class="bot-logo" />
      <h1>Muslim Vegukin Bot</h1>
      
      <!-- Replace the old <button class="theme-toggle-btn"...> with this -->
      <div class="theme-switch" id="themeToggle">
        <div class="theme-switch-knob" id="themeKnob">
          <span class="theme-switch-icon" id="themeIcon">☀️</span>
        </div>
      </div>
      
      <!-- Language flags in header - Smart 2-button display -->
      <div class="lang-flags" id="langFlags">
        <button class="flag-btn" id="flagUz" data-lang="uz" title="O'zbek">🇺🇿</button>
        <button class="flag-btn" id="flagRu" data-lang="ru" title="Русский">🇷🇺</button>
        <button class="flag-btn" id="flagEn" data-lang="en" title="English">🇬🇧</button>
      </div>
    </div>
  </header>

  <!-- MERGED PANEL (Panels 2 & 3 Combined) -->
  <div class="merged-content-panel">
    <!-- PRAYER SECTION (Fixed at top when scrolling) -->
    <section class="prayer-section-fixed">
      <button class="prayer-card-timeline is-loading" id="prayerCardBtn">
        <!-- Top Row: Date/Hijri on left, Location on right (same line) -->
        <div class="top-row">
          <div class="left-side">
            <p class="weekday" id="weekday">&nbsp;</p>
            <p class="hijri" id="hijri">&nbsp;</p>
          </div>
          <div class="right-side">
            <span class="location-icon">📍</span>
            <span class="city-name" id="cityName">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
          </div>
        </div>

        <!-- Countdown + the whole day -->
        <div class="timeline-prayer">
          <span class="arch-eyebrow" id="countdownLabel">Qoldi</span>
          <span class="arch-countdown" id="countdown">--:--:--</span>

          <!-- The whole day. Progress through the current window is drawn INSIDE
               the cell it describes, so the marker can't be misread as pointing at
               a neighbouring prayer. `progress-line` is kept as a class so
               prayerTimes.js's existing --progress writes land here. -->
          <div class="prayer-strip progress-line" id="prayerStrip">
            <div class="progress-dot">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M8.00,0.00 L10.34,2.34 L13.66,2.34 L13.66,5.66 L16.00,8.00 L13.66,10.34 L13.66,13.66 L10.34,13.66 L8.00,16.00 L5.66,13.66 L2.34,13.66 L2.34,10.34 L0.00,8.00 L2.34,5.66 L2.34,2.34 L5.66,2.34 Z" />
              </svg>
            </div>
            <div class="ps-cell" data-prayer="Fajr"><span class="ps-name">--</span><span class="ps-time">--:--</span></div>
            <div class="ps-cell ps-boundary" data-prayer="Sunrise"><span class="ps-name">--</span><span class="ps-time">--:--</span></div>
            <div class="ps-cell" data-prayer="Dhuhr"><span class="ps-name">--</span><span class="ps-time">--:--</span></div>
            <div class="ps-cell" data-prayer="Asr"><span class="ps-name">--</span><span class="ps-time">--:--</span></div>
            <div class="ps-cell" data-prayer="Maghrib"><span class="ps-name">--</span><span class="ps-time">--:--</span></div>
            <div class="ps-cell" data-prayer="Isha"><span class="ps-name">--</span><span class="ps-time">--:--</span></div>

            <!-- One rail spanning all six segments. Its notches sit exactly on the
                 cell boundaries (gutter is 0), so a filled segment always means a
                 passed prayer and the marker can't appear over the wrong cell. -->
            <div class="strip-rail"><span class="strip-fill"></span></div>
          </div>
        </div>
      </button>
    </section>

    <!-- SCROLLABLE FEATURES SECTION -->
    <div class="scrollable-features">
      <main class="main" id="featureCards">
        <!-- Feature cards will be dynamically generated -->
      </main>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/logger.js"></script> 
  <script src="js/i18n.js"></script>
  <script src="js/locationManager.js"></script>
  <script src="js/prayerTimes.js"></script>
  <script src="js/homeScreenPrompt.js"></script>
  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    
    console.log('🚀 Main page script loading...');
    
    // Notify Telegram that the web app is ready
    tg.ready();
    console.log('✅ WebApp.ready() called');
    
    // Expand the WebApp to full height
    try {
      tg.expand();
      console.log('✅ WebApp.expand() called');
    } catch (e) {
      console.log('⚠️ Expand not supported:', e);
    }
    
    // Hide Telegram's BackButton on main page
    try {
      if (tg.BackButton) {
        tg.BackButton.hide();
        console.log('✅ Telegram BackButton hidden on main page');
      }
    } catch (e) {
      console.log('⚠️ BackButton not available:', e);
    }

    // ============================================
    // FEATURE CARDS CONFIGURATION
    // ============================================
    
    const FEATURE_CARDS = {
      mosque: { icon: '🕌', labelKey: 'feature.mosques', href: 'pages/places/places.html?type=mosque' },
      restaurant: { icon: '🍽️', labelKey: 'feature.restaurants', href: 'pages/places/places.html?type=restaurant' },
      shop: { icon: '🏪', labelKey: 'feature.shops', href: 'pages/places/places.html?type=shop' },
      qibla: { icon: '🕋', labelKey: 'feature.qibla', href: 'pages/qibla/qibla.html'}, 
      qna: { icon: '🌐', labelKey: 'feature.qna', href: 'pages/questions/qna.html'},
      barcode: { icon: '🧪', labelKey: 'feature.barcode', href: 'pages/barcode/barcode.html', isNew: true},  // ← NEW FEATURE
      hikorea: {icon: '🛂',labelKey: 'feature.hikorea',href: 'pages/hikorea/hikorea.html',isNew: true},
      cars: { icon: '🚘', labelKey: 'feature.cars', href: 'pages/cars/cars.html',isNew: true},
      jobs: { icon: '💼', labelKey: 'feature.jobs', href: 'pages/job-group/job-group.html'},
      parcel: { icon: '📦', labelKey: 'feature.parcel', href: 'pages/parcel/parcel.html' },
      //vegukinShops: { icon: '🛒', labelKey: 'feature.vegukinShops', href: 'pages/vegukinshops/shops.html', isNew: true },
      links: { icon: '🔗', labelKey: 'feature.links', href: 'pages/links/links.html' },
      donation: { icon: '🤝', labelKey: 'feature.donation', href: 'pages/donation/donation.html' },      
      housing: { icon: '🏠', labelKey: 'feature.housing', href: 'pages/housing/housing.html', isNew: true},
      //market: { icon: '🛒', labelKey: 'feature.market', href: 'pages/flight/flight.html' },
      community: { icon: '👥', labelKey: 'feature.community', href: 'pages/community/community.html' }
    };

    // ============================================
    // LANGUAGE SELECTOR - SMART 2-BUTTON DISPLAY
    // ============================================

    function updateLanguageButtons() {
      const currentLang = window.I18N ? I18N.getLanguage() : 'uz';
      const flagBtns = document.querySelectorAll('.flag-btn');
      
      flagBtns.forEach(btn => {
        const btnLang = btn.getAttribute('data-lang');
        if (btnLang === currentLang) {
          // Hide current language button
          btn.style.display = 'none';
        } else {
          // Show other language buttons
          btn.style.display = 'flex';
        }
      });
      
      console.log('🌐 Language buttons updated, current:', currentLang);
    }

    function initLanguageSelector() {
      const flagBtns = document.querySelectorAll('.flag-btn');
      
      flagBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const lang = btn.getAttribute('data-lang');
          if (window.I18N) {
            I18N.setLanguage(lang);
            updateLanguageButtons();
            updateFeatureCards();
          }
          
          // Haptic feedback
          try {
            if (tg.HapticFeedback) {
              tg.HapticFeedback.impactOccurred('light');
            }
          } catch (e) {}
          
          console.log('✅ Language changed to:', lang);
        });
      });
      
      // Initial update
      updateLanguageButtons();
    }

    // index.html - Replace the old logInteraction function with this:

    // ============================================
    // FEATURE CARDS RENDERING
    // ============================================

    function updateFeatureCards() {
      const container = document.getElementById('featureCards');
      if (!container) return;
      
      const availableFeatures = window.I18N ? I18N.getAvailableFeatures() : 
        ['mosque', 'restaurant', 'shop', 'qibla', 'parcel', 'vegukinShops', 'links', 'jobs', 'donation', 'barcode', 'community', 'hikorea'];
      
      container.innerHTML = '';
      
      availableFeatures.forEach(featureKey => {
        const feature = FEATURE_CARDS[featureKey];
        if (!feature) return;
        
        const card = document.createElement('button');
        
        let cardClasses = 'card';
        if (feature.comingSoon) cardClasses += ' coming-soon';
        if (feature.isNew) cardClasses += ' new-feature';
        card.className = cardClasses;
        
        card.onclick = () => {
          // Haptic feedback
          try {
            if (tg.HapticFeedback) { 
              tg.HapticFeedback.impactOccurred('light');
            }
          } catch (e) {}
          
          // 'cars' logs itself on load in app.js (so channel deep-link opens are
          // covered too, and there's no double-log). Every other feature logs here.
          if (featureKey !== 'cars') {
            if (window.logInteraction) {
              window.logInteraction(featureKey);
            }
            sessionStorage.setItem('logged_' + featureKey, '1');
          }
          
          // Navigate immediately (no URL parameter)
          window.location.href = feature.href;
        };
        
        const label = window.I18N ? I18N.t(feature.labelKey) : feature.labelKey.split('.')[1];
        const newBadge = feature.isNew ? '<span class="new-badge">NEW</span>' : '';
        
        card.innerHTML = `
          ${newBadge}
          <span class="card-icon">${feature.icon}</span>
          <p>${label}</p>
        `;
        
        container.appendChild(card);
      });
      
      console.log('✅ Feature cards updated');
    }

    // ============================================
    // PRAYER CARD NAVIGATION
    // ============================================

    const prayerCardBtn = document.getElementById('prayerCardBtn');
    if (prayerCardBtn) {
      prayerCardBtn.addEventListener('click', () => {
        // Haptic feedback
        try {
          if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
          }
        } catch (e) {}
        
        // Log immediately (fire-and-forget with sendBeacon)
        if (window.logInteraction) {
          window.logInteraction('prayers');
        }
        sessionStorage.setItem('logged_prayers', '1');
        
        // Navigate immediately (no waiting!)
        window.location.href = 'pages/prayers.html';
      });
    }
// ============================================
    // RAMADAN BUTTON NAVIGATION
    // ============================================

    const ramadanBtn = document.getElementById('ramadanBtn');
    if (ramadanBtn) {
      ramadanBtn.addEventListener('click', () => {
        // Haptic feedback
        try {
          if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
          }
        } catch (e) {}
        
        // Log interaction (fire-and-forget)
        if (window.logInteraction) {
          window.logInteraction('ramadan');
        }
        sessionStorage.setItem('logged_ramadan', '1');
        
        // Navigate to Ramadan page
        window.location.href = 'pages/ramadan/ramadan.html';
      });
    }
    // ============================================
    // LOCATION UPDATE HANDLER
    // ============================================

    window.addEventListener('locationUpdated', (event) => {
      console.log('✅ Location updated:', event.detail.city);
    });

    // ============================================
    // LANGUAGE CHANGE LISTENER
    // ============================================

    window.addEventListener('languageChanged', () => {
      updateLanguageButtons();
      updateFeatureCards();
    });


    // ============================================
    // INITIALIZATION
    // ============================================

    document.addEventListener('DOMContentLoaded', () => {
      initLanguageSelector();
      updateFeatureCards();
      console.log('✅ Main page initialized');
    });

  // ============================================
  // THEME (DAY/NIGHT) TOGGLE
  // ============================================
  
  function initTheme() {
    const saved = localStorage.getItem('theme');
    const isNight = saved === 'night';
    applyTheme(isNight);
  }

  function applyTheme(isNight) {
      document.documentElement.classList.toggle('night-mode', isNight);
      document.body.classList.toggle('night-mode', isNight);
      const icon = document.getElementById('themeIcon');
      if (icon) {
        icon.textContent = isNight ? '🌙' : '☀️';
      }
    }

  function toggleTheme() {
    const isNight = !document.body.classList.contains('night-mode');
    applyTheme(isNight);
    localStorage.setItem('theme', isNight ? 'night' : 'day');
    
    // Haptic feedback
    try {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    } catch (e) {}
  }

  // Bind toggle button
  document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
  
  // Apply saved theme immediately (before DOMContentLoaded to avoid flash)
  initTheme();
  </script>
</body>
</html>
